services:
  - type: web
    name: jarvis-backend
    runtime: python
    pythonVersion: 3.10
    plan: free

    # Start command
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    # Environment variables
    envVars:
      - key: PYTHONUNBUFFERED
        value: true
      - key: PORT
        value: 8000

    # Build command
    buildCommand: pip install -r requirements.txt

    # Auto-deploy settings
    autoDeploy: true

    # Health check
    healthCheckPath: /health
